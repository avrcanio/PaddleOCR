# CPU-only runtime: inference and utilities using pretrained / fine-tuned weights.
# Put checkpoints under ./models (→ /workspace/models in the container).

services:
  paddleocr:
    container_name: paddleocr
    build:
      context: ../..
      dockerfile: docker/wsl2-rec-train/Dockerfile
    image: paddleocr-inference:cpu
    working_dir: /workspace/PaddleOCR
    volumes:
      - ../../:/workspace/PaddleOCR
      - ./models:/workspace/models
      - ./data:/workspace/data
      - ./output:/workspace/output
    command: ["sleep", "infinity"]
